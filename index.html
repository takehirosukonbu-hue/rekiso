<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3eb">
<title>歴史総合｜正誤トレーニング</title>
<style>
:root {
  color-scheme: light;
  --paper: #f5f3eb; --card: #fffefa; --ink: #142c2b; --muted: #526563;
  --teal: #126456; --mint: #e1efe8; --red: #a03c35; --rose: #f6e6e1; --line: #d7dfd5;
  font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid #196f95; outline-offset: 3px; }
button:disabled { cursor: default; }
.shell { min-height: 100svh; max-width: 34rem; margin: auto; padding: max(1.2rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); }
header { display: flex; align-items: center; gap: .8rem; margin-bottom: 1rem; }
.brand-mark { display: grid; place-content: center; width: 2.6rem; height: 2.6rem; border-radius: .82rem; background: var(--teal); color: white; font-size: 1.05rem; font-weight: 800; flex: none; }
h1 { margin: 0; font-size: clamp(1.1rem, 4.8vw, 1.45rem); letter-spacing: -.03em; }
.subtitle, .mode-note, .hint { margin: .25rem 0 0; font-size: .77rem; line-height: 1.55; color: var(--muted); }
.mode-picker { display: grid; grid-template-columns: 1fr 1fr; gap: .25rem; background: #e8eae2; border: 1px solid var(--line); border-radius: .9rem; padding: .22rem; }
.mode-picker button { border: 1px solid transparent; border-radius: .67rem; min-height: 2.7rem; padding: .35rem; background: transparent; font-size: .9rem; font-weight: 700; }
.mode-picker button[aria-pressed="true"] { background: var(--card); border-color: var(--line); color: var(--teal); box-shadow: 0 1px 2px #193b2312; }
.mode-note { min-height: 2.1rem; padding-top: .26rem; }
.progress-row { display: flex; justify-content: space-between; gap: .35rem; margin: .35rem 0; color: var(--muted); font-size: .78rem; font-weight: 700; }
.progress-row strong { color: var(--ink); }
progress { display: block; width: 100%; height: .38rem; appearance: none; border: 0; border-radius: 999px; background: #dfe5dc; overflow: hidden; }
progress::-webkit-progress-bar { background: #dfe5dc; }
progress::-webkit-progress-value { background: var(--teal); border-radius: 999px; }
progress::-moz-progress-bar { background: var(--teal); border-radius: 999px; }
.stage { position: relative; margin: .85rem 0 .8rem; overflow: clip; border-radius: 1.18rem; }
.stage::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg,var(--rose) 0 49%,var(--mint) 51% 100%); border-radius: inherit; }
.card { position: relative; display: flex; flex-direction: column; min-height: clamp(12rem, 34svh, 18rem); padding: 1.12rem; border: 1px solid var(--line); border-radius: inherit; background: var(--card); touch-action: pan-y; user-select: none; transition: transform 150ms ease-out, border-color 120ms; }
.card.dragging { transition: none; }
.card[data-direction="right"] { border-color: var(--teal); }
.card[data-direction="left"] { border-color: var(--red); }
.card-meta { display: flex; justify-content: space-between; gap: .5rem; align-items: center; min-height: 1.4rem; margin-bottom: .68rem; }
.chapter { color: var(--teal); background: var(--mint); border-radius: .35rem; padding: .2rem .44rem; font-size: .75rem; font-weight: 700; }
.origin { color: var(--muted); font-size: .73rem; }
.question { margin: auto 0; padding: .3rem 0 .65rem; font-size: clamp(1.1rem, 4.85vw, 1.42rem); line-height: 1.7; font-weight: 700; overflow-wrap: anywhere; }
.swipe-label { position: absolute; bottom: .6rem; right: .75rem; font-weight: 800; font-size: .85rem; color: var(--teal); }
.card[data-direction="left"] .swipe-label { color: var(--red); }
.card.answered { min-height: 0; touch-action: auto; user-select: text; }
.card.answered .question { font-size: 1.03rem; padding-bottom: .1rem; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }
.action { min-height: 3.2rem; padding: .55rem .4rem; border: 1px solid transparent; border-radius: .8rem; font-weight: 800; }
.action small { margin-inline: .18rem; font-size: .78rem; }
.false { background: var(--rose); color: var(--red); border-color: #ead3cc; }
.true { background: var(--mint); color: var(--teal); border-color: #cbded4; }
.hint { text-align: center; margin: .55rem 0 0; }
.feedback, .summary { border: 1px solid var(--line); padding: .9rem 1rem; border-radius: .94rem; background: var(--card); }
.feedback { border-left: .28rem solid var(--teal); }
.feedback[data-correct="false"] { border-left-color: var(--red); }
.feedback h2, .summary h2 { margin: 0 0 .35rem; font-size: 1.05rem; }
.feedback[data-correct="false"] h2 { color: var(--red); }
.feedback[data-correct="true"] h2 { color: var(--teal); }
.feedback p, .summary p { margin: 0; font-size: .91rem; line-height: 1.6; }
.feedback .explanation { margin-top: .42rem; }
.primary { background: var(--teal); color: white; width: 100%; border: 0; min-height: 3rem; border-radius: .75rem; font-weight: 800; margin-top: .65rem; }
.status-note { margin: .7rem 0 0; color: var(--muted); font-size: .75rem; }
@media (max-height: 650px) { .shell { padding-top: .75rem; } header { margin-bottom: .7rem; } .card { min-height: 10rem; } .card.answered { min-height: 0; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<main class="shell">
  <header>
    <span class="brand-mark" aria-hidden="true">歴</span>
    <div><h1>歴史総合の正誤</h1><p class="subtitle">第24〜31章 · 全199問</p></div>
  </header>
  <div class="mode-picker" role="group" aria-label="出題モード">
    <button id="random-mode" type="button" aria-pressed="true">ランダム</button>
    <button id="review-mode" type="button" aria-pressed="false">間違い優先</button>
  </div>
  <p id="mode-note" class="mode-note"></p>
  <div class="progress-row"><strong id="position"></strong><span id="score"></span></div>
  <progress id="progress" value="0" max="20" aria-label="今回の回答数"></progress>

  <div class="stage" id="stage">
    <article class="card" id="card" aria-labelledby="question">
      <div class="card-meta"><span class="chapter" id="chapter"></span><span class="origin" id="origin"></span></div>
      <p class="question" id="question" tabindex="-1"></p>
      <span id="swipe-label" class="swipe-label" aria-hidden="true"></span>
    </article>
  </div>
  <div id="answer-controls">
    <div class="actions">
      <button type="button" class="action false" id="answer-false" aria-label="× 誤り">← <small>× 誤り</small></button>
      <button type="button" class="action true" id="answer-true" aria-label="○ 正しい"><small>○ 正しい</small> →</button>
    </div>
    <p class="hint">カードをスワイプするか、ボタンをタップ</p>
  </div>

  <section id="result" hidden>
    <div class="feedback" id="feedback">
      <h2 id="result-title" tabindex="-1"></h2>
      <p id="result-answer"></p>
      <p class="explanation" id="explanation"></p>
    </div>
    <button type="button" class="primary" id="next">次の問題</button>
  </section>
  <section id="summary" class="summary" hidden>
    <h2 id="summary-title" tabindex="-1">今回の結果</h2>
    <p id="summary-text"></p>
    <button type="button" class="primary" id="restart">もう一度</button>
  </section>
  <p id="storage-note" class="status-note" hidden>このブラウザーでは履歴を保存できません。ページを開いている間は復習できます。</p>
  <noscript>このアプリを使うにはブラウザーでJavaScriptを有効にしてください。</noscript>
</main>

["2-88",31,"ツォルフェラインで強制労働をさせられた人々には、外国人捕虜と民間人が含まれた。",true,"原資料ではナチス期に数千人が従事させられたとする。"],
["2-89",24,"大戦景気で伸びた海運・造船・鉄鋼は、軍需の注文や対アジア貿易の拡大とは無関係だった。",false,"軍需と対アジア貿易が大戦景気を支えた。"],
["2-90",24,"原資料の約100万人は、負傷者を除いた毒ガスによる死者だけの数である。",false,"死者と負傷者を合わせた概数。"],
["2-91",24,"西部戦線で塹壕戦が長引いたのは、一方の陣営だけが防御陣地を築いたためだった。",false,"両陣営が塹壕にこもり、互いに突破が難しくなった。"],
["2-92",31,"「ハイル・ヒトラー」はナチ党の紋章の名称で、ハーケンクロイツはその敬礼に伴う挨拶だった。",false,"紋章はハーケンクロイツ。敬礼に伴う挨拶はハイル・ヒトラー。"],
["2-93",26,"ルール工業地帯を占領した国には、フランスだけでなくベルギーも含まれた。",true,"賠償不履行を理由に両国が1923年に占領した。"],
["2-94",28,"「連ソ」は共産党員の受け入れ、「容共」はソ連との提携を指す。",false,"連ソと容共の意味が逆。"],
["2-95",26,"不戦条約は対独賠償の返済方式を国際的に定めた条約である。",false,"不戦条約は国策の手段としての戦争の放棄を定めた。"]]
</script>
<script>
"use strict";
const element = id => document.getElementById(id);
const questions = JSON.parse(element("question-bank").textContent)
  .map(([id, chapter, text, answer, explanation]) => ({ id, chapter, text, answer, explanation }));
const byId = new Map(questions.map(question => [question.id, question]));
const modes = ["random", "review"];
const storageKey = "history-true-false:v1";
const roundSize = 20;
const card = element("card");
let gesture = null;

function validRound(round) {
  return round && Array.isArray(round.ids) && round.ids.length === roundSize &&
    new Set(round.ids).size === roundSize && round.ids.every(id => byId.has(id)) &&
    Number.isInteger(round.index) && round.index >= 0 && round.index <= roundSize &&
    Array.isArray(round.answers) && round.answers.every(answer => typeof answer === "boolean") &&
    (round.answers.length === round.index || (round.index < roundSize && round.answers.length === round.index + 1));
}
function readState() {
  const state = { mode: "random", history: {}, rounds: {} };
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (!saved) return state;
    if (modes.includes(saved.mode)) state.mode = saved.mode;
    for (const [id, entry] of Object.entries(saved.history ?? {})) {
      if (byId.has(id) && entry && typeof entry.last === "boolean" &&
          Number.isInteger(entry.misses) && entry.misses >= 0) state.history[id] = entry;
    }
    for (const mode of modes) {
      if (validRound(saved.rounds?.[mode])) state.rounds[mode] = saved.rounds[mode];
    }
  } catch {
    // A malformed record can be replaced with a fresh one.
  }
  return state;
}
const state = readState();

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch {
    element("storage-note").hidden = false;
  }
}
function shuffled(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
function priority({ id }) {
  const entry = state.history[id];
  if (entry?.last === false) return 0;
  if (entry?.misses > 0) return 1;
  if (!entry) return 2;
  return 3;
}
function createRound(mode) {
  const list = shuffled(questions);
  if (mode === "review") list.sort((a, b) => priority(a) - priority(b));
  return { ids: list.slice(0, roundSize).map(item => item.id), index: 0, answers: [] };
}
function round() {
  return state.rounds[state.mode];
}
function correctCount(current) {
  return current.answers.reduce((count, chosen, index) =>
    count + Number(byId.get(current.ids[index]).answer === chosen), 0);
}
function resetGesture() {
  gesture = null;
  card.classList.remove("dragging");
  card.style.transform = "";
  delete card.dataset.direction;
  element("swipe-label").textContent = "";
}
function render(focus = false) {
  resetGesture();
  const current = round();
  const finished = current.index === roundSize;
  const answered = !finished && current.answers.length > current.index;
  const correct = correctCount(current);
  const outstanding = Object.values(state.history).filter(entry => !entry.last).length;
  for (const mode of modes) element(mode + "-mode").setAttribute("aria-pressed", String(mode === state.mode));
  element("mode-note").textContent = state.mode === "random"
    ? "全199問から、1回につき20問を重複なしで出題。"
    : outstanding
      ? "直近で間違えた問題を優先します（現在 " + outstanding + " 問）。"
      : "直近の誤答がないときは、以前の誤答や未回答を優先します。";
  element("position").textContent = finished ? "20問完了" : (current.index + 1) + " / " + roundSize + " 問";
  element("score").textContent = "今回の正解 " + correct + " 問";
  element("progress").value = current.answers.length;
  element("stage").hidden = finished;
  element("answer-controls").hidden = finished || answered;
  element("result").hidden = !answered;
  element("summary").hidden = !finished;
  card.classList.toggle("answered", answered);
  if (finished) {
    element("summary-text").textContent = roundSize + "問中 " + correct + "問正解（" + Math.round(correct / roundSize * 100) + "%）。誤答 " + (roundSize - correct) + "問。";
    if (focus) element("summary-title").focus({ preventScroll: true });
    return;
  }
  const question = byId.get(current.ids[current.index]);
  const [set, number] = question.id.split("-");
  element("chapter").textContent = "第" + question.chapter + "章";
  element("origin").textContent = "第" + set + "セット · 問" + number;
  element("question").textContent = question.text;
  if (answered) {
    const chosen = current.answers[current.index];
    const matched = chosen === question.answer;
    element("feedback").dataset.correct = String(matched);
    element("result-title").textContent = matched ? "正解" : "不正解";
    element("result-answer").textContent = (question.answer ? "正解は ○" : "正解は ×") + "　あなたの回答は " + (chosen ? "○" : "×");
    element("explanation").textContent = question.explanation;
    element("next").textContent = current.index === roundSize - 1 ? "結果を見る" : "次の問題";
    if (focus) element("result-title").focus({ preventScroll: true });
  } else if (focus) {
    element("question").focus({ preventScroll: true });
  }
}
function canAnswer() {
  const current = round();
  return current.index < roundSize && current.answers.length === current.index;
}
function answer(choice) {
  if (!canAnswer()) return;
  const current = round();
  const question = byId.get(current.ids[current.index]);
  const correct = choice === question.answer;
  current.answers.push(choice);
  state.history[question.id] = {
    last: correct,
    misses: (state.history[question.id]?.misses ?? 0) + Number(!correct),
  };
  save();
  render(true);
}
function next() {
  const current = round();
  if (current.index >= roundSize || current.answers.length !== current.index + 1) return;
  current.index++;
  save();
  render(true);
}
function selectMode(mode) {
  if (mode === state.mode) return;
  state.mode = mode;
  state.rounds[mode] ??= createRound(mode);
  save();
  render();
}
state.rounds[state.mode] ??= createRound(state.mode);
save();
render();
for (const mode of modes) element(mode + "-mode").addEventListener("click", () => selectMode(mode));
element("answer-false").addEventListener("click", () => answer(false));
element("answer-true").addEventListener("click", () => answer(true));
element("next").addEventListener("click", next);
element("restart").addEventListener("click", () => {
  state.rounds[state.mode] = createRound(state.mode);
  save();
  render(true);
});
card.addEventListener("pointerdown", event => {
  if (!canAnswer() || !event.isPrimary || event.button !== 0) return;
  gesture = { id: event.pointerId, x: event.clientX, y: event.clientY, horizontal: false };
  card.setPointerCapture(event.pointerId);
});
card.addEventListener("pointermove", event => {
  if (gesture?.id !== event.pointerId) return;
  const dx = event.clientX - gesture.x;
  const dy = event.clientY - gesture.y;
  if (!gesture.horizontal && Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) {
    resetGesture();
    return;
  }
  if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) gesture.horizontal = true;
  if (!gesture.horizontal) return;
  const travel = Math.max(-100, Math.min(100, dx * .62));
  card.classList.add("dragging");
  card.dataset.direction = dx > 0 ? "right" : "left";
  card.style.transform = "translateX(" + travel + "px)";
  element("swipe-label").textContent = dx > 0 ? "○ 正しい" : "× 誤り";
});
card.addEventListener("pointerup", event => {
  if (gesture?.id !== event.pointerId) return;
  const dx = event.clientX - gesture.x;
  const dy = event.clientY - gesture.y;
  const threshold = Math.min(92, Math.max(48, card.clientWidth * .19));
  resetGesture();
  if (Math.abs(dx) >= threshold && Math.abs(dx) > Math.abs(dy) * 1.3) answer(dx > 0);
});
card.addEventListener("pointercancel", resetGesture);
card.addEventListener("lostpointercapture", resetGesture);
document.addEventListener("keydown", event => {
  if (!canAnswer() || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
  event.preventDefault();
  answer(event.key === "ArrowRight");
});
</script>
